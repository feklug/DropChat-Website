<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DropChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --bg-soft:#F5F3FF;
  --border:#E4E0ED;
  --text:#1C1917;
  --accent:#8B5CF6;
  --radius-pill:9999px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
main{text-align:center;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;}
h1{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.035em;margin:0 0 18px;}
.badge{
  display:inline-block;
  font-size:14px;font-weight:700;
  padding:9px 20px;
  border-radius:var(--radius-pill);
  background:var(--bg-soft);
  color:var(--accent);
  border:1px solid var(--border);
}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){main{animation:none;}}
</style>
</head>
<body>
  <main>
    <h1>DropChat</h1>
    <span class="badge">Bald verfügbar</span>
  </main>
</body>
</html>
